server {
    listen       80;
    server_name  picsketch;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # URLが見つからない場合はindex.htmlを返す
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
